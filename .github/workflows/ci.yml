name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: `npm ci` runs dependency lifecycle scripts, which must not get a
# write-scoped GITHUB_TOKEN if the repo default ever is write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR pushes are cancelled. On main, two quick merges cancelled
  # the first commit's run, so it landed without CI ever finishing on it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # better-sqlite3 e node-pty compilam nativo; o postinstall do playwright só
      # baixa o browser no job de smoke.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # `build` = tsc dos 4 projetos (web, server, relay, monitor) + vite build.
      - run: npm run build
      - run: npm test
      # Roda DEPOIS do build de propósito: o alvo mais importante é o dist/, que é
      # literalmente o que o navegador baixa. Motivo em scripts/scan-secrets.ts.
      - run: npm run scan:secrets

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - run: npm run smoke:ui
